<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidan finns inte — Förgätmigej</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tokens.css">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--fmn-ground);color:var(--fmn-ink);
  font-family:"Karla","Helvetica Neue",Arial,sans-serif;
  text-align:center;padding:24px;-webkit-font-smoothing:antialiased;
}
.box{max-width:34ch}
svg{display:block;margin:0 auto 28px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:300;font-size:clamp(28px,6vw,40px);line-height:1.12;letter-spacing:-.015em;margin:0 0 14px}
p{color:var(--fmn-stem);margin:0 0 30px;font-size:16px;line-height:1.55}
a{display:inline-block;background:var(--fmn-blue-deep);color:var(--fmn-ring);text-decoration:none;font-size:16px;font-weight:500;padding:12px 24px;border-radius:999px}
a:hover{background:#33508B}
a:focus-visible{outline:2px solid var(--fmn-ink);outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <svg width="52" height="52" viewBox="0 0 32 32" aria-hidden="true">
      <g fill="var(--fmn-blue)" opacity=".55">
        <circle cx="16" cy="6.7" r="5.8"/><circle cx="24.9" cy="13.1" r="5.8"/>
        <circle cx="21.5" cy="23.6" r="5.8"/><circle cx="10.5" cy="23.6" r="5.8"/>
        <circle cx="7.1" cy="13.1" r="5.8"/>
      </g>
      <circle cx="16" cy="16" r="5.7" fill="var(--fmn-ring)"/>
      <circle cx="16" cy="16" r="3.7" fill="var(--fmn-eye)"/>
    </svg>
    <h1>Den här sidan finns inte.</h1>
    <p>Adressen kan vara felstavad, eller så har sidan flyttat.</p>
    <a href="/">Till startsidan</a>
  </div>
</body>
</html>
