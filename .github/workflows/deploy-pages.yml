name: Publicera till GitHub Pages

# Astro-appen i web/ byggs till statiska filer och publiceras. Det kräver ingen
# server — appen har ingen server-sida — och därför ingen betald hosting.
on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installera
        run: npm ci

      - name: Bygg
        run: npm run build

      # Utan .nojekyll filtrerar Jekyll bort allt som börjar med _, och Astro
      # lägger hela sin bundle i _astro/. Sidan hade blivit ostilad utan att
      # bygget klagade.
      - name: Stäng av Jekyll
        run: touch dist/.nojekyll

      - name: Konfigurera Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp artefakt
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
